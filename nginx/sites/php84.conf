# Runtime-only diagnostic host. It does not boot an ERP application.
server {
    listen 80;
    listen [::]:80;
    server_name php84.laradock.test;
    client_max_body_size 64m;

    # Defer Docker DNS resolution so Nginx can start with the php84 profile off.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php84_upstream php-fpm-84:9000;

    location = /__runtime {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/laradock/php84/runtime.php;
        fastcgi_pass $php84_upstream;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
